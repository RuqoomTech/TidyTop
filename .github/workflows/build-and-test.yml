name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  windows-mvp:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish portable Windows build
        run: dotnet publish src/TidyTop.App/TidyTop.App.csproj --configuration Release --runtime win-x64 --self-contained false --output ./publish/windows

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: tidytop-windows-portable
          path: ./publish/windows
